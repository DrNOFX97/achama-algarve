[build]
  publish = "."

# ── Redireccionamentos ──────────────────────────────────────────────────────
# Forçar HTTPS e canónico sem www
[[redirects]]
  from   = "http://acimha.pt/*"
  to     = "https://acimha.pt/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.acimha.pt/*"
  to     = "https://acimha.pt/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.acimha.pt/*"
  to     = "https://acimha.pt/:splat"
  status = 301
  force  = true

# Paginas legais: forcar a URL canonica .html (evita 200 duplicado sem extensao)
[[redirects]]
  from   = "/politica-privacidade"
  to     = "/politica-privacidade.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/termos-condicoes"
  to     = "/termos-condicoes.html"
  status = 301
  force  = true

# ── Cabeçalhos de segurança ─────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    # CSP: permite o site a si próprio, Google Fonts, Netlify Forms e o CDN do jsPDF (ficha de inscrição)
    Content-Security-Policy    = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://acimha.pt; connect-src 'self'; frame-ancestors 'none';"

# Cache agressivo para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
